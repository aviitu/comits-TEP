      provider_name: pegarlots_cal.com
      provider_type: workflow
      tool_label: pegarlots_cal.com
      tool_name: pegarslots_cal_com
      tool_parameters:
        datafim: ''
        datainicio: ''
    - enabled: true
      isDeleted: false
      notAuthor: false
